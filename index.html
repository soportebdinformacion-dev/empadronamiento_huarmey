<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Empadronamiento Huarmey 2026</title>
    <style>
        :root { --rojo: #C62828; --verde: #2E7D32; --gris: #f4f4f4; --blanco: #ffffff; }
        body { font-family: 'Segoe UI', Roboto, sans-serif; background: var(--gris); margin: 0; padding: 10px; }
        .card { background: var(--blanco); max-width: 550px; margin: auto; padding: 20px; border-radius: 15px; border-top: 8px solid var(--rojo); box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .logo { display: block; margin: 0 auto 15px; max-width: 160px; }
        h2 { text-align: center; color: var(--verde); font-size: 1.2rem; margin-bottom: 20px; }
        section { margin-bottom: 15px; padding: 15px; border: 1px solid #ddd; border-radius: 12px; }
        legend { font-weight: bold; color: var(--rojo); font-size: 0.9rem; text-transform: uppercase; }
        label { display: block; margin-top: 12px; font-size: 0.85rem; font-weight: 600; color: #444; }
        input, select { width: 100%; padding: 12px; margin-top: 5px; border: 1.5px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 1rem; }
        input:focus { border-color: var(--verde); outline: none; }
        .btn { background: var(--verde); color: white; border: none; width: 100%; padding: 16px; border-radius: 10px; font-size: 1.1rem; font-weight: bold; margin-top: 25px; cursor: pointer; transition: 0.3s; }
        .offline-notice { background: #FFEBEE; color: #C62828; text-align: center; padding: 8px; border-radius: 5px; font-size: 0.8rem; display: none; margin-bottom: 10px; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="card">
    <img src="ICONO HUARMEY.png" class="logo" alt="Agrícola Huarmey">
    <h2>Campaña Agrícola 2026</h2>
    <div id="offline-msg" class="offline-notice">⚠️ Estás trabajando sin conexión. Los datos se sincronizarán después.</div>

    <form id="formEmpadronamiento">
        <section>
            <legend>1. Información Personal</legend>
            
            <label>Tipo de Registro:</label>
            <select id="tipoReg" required>
                <option value="Registro independiente">Registro independiente</option>
                <option value="JOSE CHAVEZ">JOSE CHAVEZ</option>
                <option value="RIVALDO VALLES">RIVALDO VALLES</option>
                <option value="ALEX RUFASTO">ALEX RUFASTO</option>
                <option value="OSCAR BARREDA">OSCAR BARREDA</option>
                <option value="PILAR MONJA">PILAR MONJA</option>
                <option value="ELESTER CHINCHAY">ELESTER CHINCHAY</option>
            </select>

            <label>DNI (8 dígitos):</label>
            <input type="number" id="dni" required minlength="8" maxlength="8" oninput="if(this.value.length > 8) this.value = this.value.slice(0, 8);">

            <label>Apellidos y Nombres:</label>
            <input type="text" id="apellidos" required placeholder="Ej: Perez Garcia, Juan">

            <label>Fecha de Nacimiento:</label>
            <input type="date" id="nacimiento" required onchange="calcularEdad(this.value)">

            <label>Edad:</label>
            <input type="text" id="edad" readonly style="background:#f0f0f0" placeholder="Calculado automáticamente">

            <label>N° de Hijos:</label>
            <input type="number" id="hijos" required min="0" value="0">

            <label>Celular / WhatsApp (9 dígitos):</label>
            <div style="display:flex; gap:10px">
                <input type="number" id="celular" placeholder="Celular" required oninput="if(this.value.length > 9) this.value = this.value.slice(0, 9);">
                <input type="number" id="whatsapp" placeholder="WhatsApp" required oninput="if(this.value.length > 9) this.value = this.value.slice(0, 9);">
            </div>

            <label>¿Cómo conociste la empresa?</label>
            <select id="conoce" required>
                <option value="Facebook">Facebook</option>
                <option value="Amigo">Amigo</option>
                <option value="WhatsApp">WhatsApp</option>
                <option value="Líder">Líder</option>
                <option value="Reclutador">Reclutador</option>
                <option value="Otros">Otros</option>
            </select>

            <label>Referencias de la empresa:</label>
            <select id="referencias" required>
                <option value="Buenos pagos">Buenos pagos</option>
                <option value="Buen trato al personal">Buen trato al personal</option>
                <option value="Buenos bonos">Buenos bonos</option>
                <option value="Buenos sorteos">Buenos sorteos</option>
                <option value="Sin opinar">Sin opinar</option>
            </select>
        </section>

        <section>
            <legend>2. Laboral y Residencia</legend>
            
            <label>Tipo de trabajo:</label>
            <select id="tipoTrabajo" required>
                <option value="Campo">Campo</option>
                <option value="Packing">Packing</option>
            </select>

            <label>Experiencia:</label>
            <select id="experiencia" required>
                <option value="Ninguno">Ninguno</option>
                <option value="Líder de zona + cosechador">Líder de zona + cosechador</option>
                <option value="Cosecha arándanos jornal">Cosecha arándanos jornal</option>
                <option value="Operario packing jornal">Operario packing jornal</option>
                <option value="Conductor AI-II-III">Conductor AI-II-III</option>
                </select>

            <label>Ubicación (Dep / Prov / Dist):</label>
            <input type="text" id="dep" placeholder="Departamento" required>
            <input type="text" id="prov" placeholder="Provincia" required>
            <input type="text" id="dist" placeholder="Distrito" required>
            <input type="text" id="zona" placeholder="Zona Ej. Alan Garcia" required>
        </section>

        <section>
            <legend>3. Confirmación</legend>
            <label>Disponibilidad:</label>
            <select id="disponibilidad" required onchange="toggleFechaIngreso(this.value)">
                <option value="Inmediato">Inmediato</option>
                <option value="Ingresaré en otra fecha">Ingresaré en otra fecha</option>
            </select>

            <div id="divFechaIngreso" class="hidden">
                <label>Fecha de Ingreso:</label>
                <input type="date" id="fechaIngreso">
            </div>
        </section>

        <button type="submit" class="btn">REGISTRAR PERSONAL</button>
    </form>
</div>

<script src="https://unpkg.com/dexie@3.2.0/dist/dexie.min.js"></script>
<script>
    // Inicializar DB Local
    const db = new Dexie('HuarmeyDB_2026');
    db.version(1).stores({ registros: '++id, estado' });

   async function sincronizar() {
    if (!navigator.onLine) return;
    
    // Obtenemos registros con estado 'P' (Pendiente)
    const pends = await db.registros.where('estado').equals('P').toArray();
    
    for (let r of pends) {
        try {
            // Reemplaza con tu URL real de implementación
            const URL_WEB_APP = 'https://script.google.com/macros/s/AKfycbyXW-h9qFmP_dZ-Ze4QR6SXD9T0mMmhEaQtXDTVDsJAPamzMl-ixu-RRQni_riSykbdFg/exec'; 

            await fetch(URL_WEB_APP, {
                method: 'POST',
                mode: 'no-cors', // Necesario para Google Apps Script desde el navegador
                body: JSON.stringify(r),
                headers: {
                    'Content-Type': 'application/json'
                }
            });

            // Como usamos no-cors, no podemos leer la respuesta, 
            // pero si no salta al catch, asumimos éxito y actualizamos a 'E' (Enviado)
            await db.registros.update(r.id, { estado: 'E' });
            console.log("Registro sincronizado para DNI: " + r.dni);
            
        } catch (error) {
            console.error("Fallo al sincronizar:", error);
        }
    }
}

    function calcularEdad(fecha) {
        if(!fecha) return;
        const hoy = new Date();
        const cumple = new Date(fecha);
        let edad = hoy.getFullYear() - cumple.getFullYear();
        const m = hoy.getMonth() - cumple.getMonth();
        if (m < 0 || (m === 0 && hoy.getDate() < cumple.getDate())) edad--;
        document.getElementById('edad').value = edad + " años";
    }

    function toggleFechaIngreso(val) {
        const div = document.getElementById('divFechaIngreso');
        const input = document.getElementById('fechaIngreso');
        if(val === "Ingresaré en otra fecha") {
            div.classList.remove('hidden');
            input.required = true;
        } else {
            div.classList.add('hidden');
            input.required = false;
        }
    }

    document.getElementById('formEmpadronamiento').onsubmit = async (e) => {
        e.preventDefault();
        
        const registro = {
            fecha: new Date().toLocaleString('es-PE'),
            tipoReg: document.getElementById('tipoReg').value,
            dni: document.getElementById('dni').value,
            apellidos: document.getElementById('apellidos').value,
            nacimiento: document.getElementById('nacimiento').value,
            edad: document.getElementById('edad').value,
            hijos: document.getElementById('hijos').value,
            celular: document.getElementById('celular').value,
            whatsapp: document.getElementById('whatsapp').value,
            conoce: document.getElementById('conoce').value,
            referencias: document.getElementById('referencias').value,
            tipoTrabajo: document.getElementById('tipoTrabajo').value,
            experiencia: document.getElementById('experiencia').value,
            dep: document.getElementById('dep').value,
            prov: document.getElementById('prov').value,
            dist: document.getElementById('dist').value,
            zona: document.getElementById('zona').value,
            disponibilidad: document.getElementById('disponibilidad').value === "Inmediato" ? 
                            "Inmediato" : "Fecha: " + document.getElementById('fechaIngreso').value,
            estado: 'Pendiente'
        };
        
        await db.registros.add(registro);
        alert("✅ Registro guardado localmente.");
        e.target.reset();
        document.getElementById('edad').value = "";
        sincronizar();
    };

    async function sincronizar() {
        if (!navigator.onLine) return;
        const pends = await db.registros.where('estado').equals('Pendiente').toArray();
        
        for (let r of pends) {
            try {
                const res = await fetch('TU_URL_DE_APPS_SCRIPT', {
                    method: 'POST',
                    mode: 'no-cors', // Importante para Google Apps Script
                    body: JSON.stringify(r)
                });
                await db.registros.update(r.id, { estado: 'Sincronizado' });
            } catch (err) {
                console.error("Error sincronizando:", err);
            }
        }
    }

    window.addEventListener('online', () => {
        document.getElementById('offline-msg').style.display = 'none';
        sincronizar();
    });
    window.addEventListener('offline', () => {
        document.getElementById('offline-msg').style.display = 'block';
    });

    // Registrar Service Worker
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('service-worker.js');
    }
</script>
</body>
</html>

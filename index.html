        body { font-family: 'Segoe UI', Roboto, sans-serif; background: var(--gris); margin: 0; padding: 10px; }
        .card { background: var(--blanco); max-width: 550px; margin: auto; padding: 20px; border-radius: 15px; border-top: 8px solid var(--rojo); box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .logo { 
            display: block; 
            margin: 0 auto 15px; 
            width: 100%;       
            max-width: 100%;   
            height: auto;      
            border-radius: 8px; 
        }
        h2 { text-align: center; color: var(--verde); font-size: 1.2rem; margin-bottom: 20px; }
        section { margin-bottom: 15px; padding: 15px; border: 1px solid #ddd; border-radius: 12px; }
        legend { font-weight: bold; color: var(--rojo); font-size: 0.9rem; text-transform: uppercase; }
        label { display: block; margin-top: 12px; font-size: 0.85rem; font-weight: 600; color: #444; }
        input, select { width: 100%; padding: 12px; margin-top: 5px; border: 1.5px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 1rem; }
        input:focus { border-color: var(--verde); outline: none; }
        .btn { background: var(--verde); color: white; border: none; width: 100%; padding: 16px; border-radius: 10px; font-size: 1.1rem; font-weight: bold; margin-top: 25px; cursor: pointer; transition: 0.3s; }
        
        #status-container { margin-bottom: 20px; padding: 12px; border-radius: 10px; text-align: center; font-weight: bold; font-size: 0.9rem; transition: 0.3s; }
        .online { background-color: #C8E6C9; color: #2E7D32; border: 1px solid #2E7D32; }
        .offline { background-color: #FFCDD2; color: #C62828; border: 1px solid #C62828; }
        .syncing { animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        .hidden { display: none; }

        #lista-pendientes { margin-top: 10px; font-size: 0.75rem; text-align: left; background: rgba(255,255,255,0.6); border-radius: 8px; padding: 8px; max-height: 120px; overflow-y: auto; border: 1px dashed #999; }

<script src="https://unpkg.com/dexie@3.2.0/dist/dexie.min.js"></script>
<script>
    const URL_GOOGLE = 'https://script.google.com/macros/s/AKfycbwjlxnXI6BssN_CFk_-VYgXR-C-juUZyaomVllHubsZPKLBpC_71_vZXgkw8st0TtYPow/exec'; 

    // Variable global para almacenar la base de datos de ubicaciones
    let ubicacionesData = [];

    // 1. Inicializar Base de Datos Local
    const db = new Dexie('BD_REGISTROS_HUARMEY');
    db.version(1).stores({ registros: '++id, estado' });

    // Cargar Ubicaciones desde Google Sheets
    async function cargarUbicaciones() {
        if (!navigator.onLine) return;
        try {
            const response = await fetch(URL_GOOGLE);
            ubicacionesData = await response.json();
            
            // Guardar en localStorage para respaldo offline
            localStorage.setItem('cache_ubicaciones', JSON.stringify(ubicacionesData));
            inicializarSelectores();
        } catch (error) {
            console.error("Error al cargar ubicaciones:", error);
            // Si falla el internet o da error, intentar cargar del respaldo local
            const cache = localStorage.getItem('cache_ubicaciones');
            if(cache) {
                ubicacionesData = JSON.parse(cache);
                inicializarSelectores();
            }
        }
    }

    function inicializarSelectores() {
        const depSelect = document.getElementById('dep');
        
        // Obtener departamentos únicos
        const departamentos = [...new Set(ubicacionesData.map(item => item.departamento))];
        
        depSelect.innerHTML = '<option value="">Departamento</option>';
        departamentos.forEach(dep => {
            if(dep) depSelect.innerHTML += `<option value="${dep}">${dep}</option>`;
        });

        // Evento cambio de Departamento
        depSelect.onchange = function() {
            const provSelect = document.getElementById('prov');
            const distSelect = document.getElementById('dist');
            const zonaSelect = document.getElementById('zona');
            
            provSelect.innerHTML = '<option value="">Provincia</option>';
            distSelect.innerHTML = '<option value="">Distrito</option>';
            zonaSelect.innerHTML = '<option value="">Zona Ej. Alan Garcia</option>';
            
            if(!this.value) return;

            const provincias = [...new Set(ubicacionesData
                .filter(item => item.departamento === this.value)
                .map(item => item.provincia))];

            provincias.forEach(prov => {
                if(prov) provSelect.innerHTML += `<option value="${prov}">${prov}</option>`;
            });
        };

        // Evento cambio de Provincia
        document.getElementById('prov').onchange = function() {
            const depValue = document.getElementById('dep').value;
            const distSelect = document.getElementById('dist');
            const zonaSelect = document.getElementById('zona');
            
            distSelect.innerHTML = '<option value="">Distrito</option>';
            zonaSelect.innerHTML = '<option value="">Zona Ej. Alan Garcia</option>';
            
            if(!this.value) return;

            const distritos = [...new Set(ubicacionesData
                .filter(item => item.departamento === depValue && item.provincia === this.value)
                .map(item => item.distrito))];

            distritos.forEach(dist => {
                if(dist) distSelect.innerHTML += `<option value="${dist}">${dist}</option>`;
            });
        };

        // Evento cambio de Distrito
        document.getElementById('dist').onchange = function() {
            const depValue = document.getElementById('dep').value;
            const provValue = document.getElementById('prov').value;
            const zonaSelect = document.getElementById('zona');
            
            zonaSelect.innerHTML = '<option value="">Zona Ej. Alan Garcia</option>';
            
            if(!this.value) return;

            const zonas = [...new Set(ubicacionesData
                .filter(item => item.departamento === depValue && item.provincia === provValue && item.distrito === this.value)
                .map(item => item.lugar))];

            zonas.forEach(zona => {
                if(zona) zonaSelect.innerHTML += `<option value="${zona}">${zona}</option>`;
            });
        };
    }

    // 2. Función de Red y Estados
    async function actualizarContador() {
        const pends = await db.registros.where('estado').equals('P').toArray();
        const countSpan = document.getElementById('pending-count');
        const listaDiv = document.getElementById('lista-pendientes');
        const itemsDiv = document.getElementById('items-pendientes');
        
        countSpan.innerText = pends.length;

        if (pends.length > 0) {
            listaDiv.classList.remove('hidden');
            itemsDiv.innerHTML = pends.map(r => 
                `<div style="margin-bottom:4px; padding:2px; border-bottom:1px solid rgba(0,0,0,0.05);">
                    DNI: <strong>${r.dni}</strong> - ${r.apellidos.toUpperCase()}
                </div>`
            ).join('');
        } else {
            listaDiv.classList.add('hidden');
        }
    }

    function updateNetStatus() {
        const statusCont = document.getElementById('status-container');
        const netText = document.getElementById('network-status');
        if (navigator.onLine) {
            statusCont.className = "online";
            netText.innerText = "● CONECTADO";
            sincronizar();
            if(ubicacionesData.length === 0) cargarUbicaciones();
        } else {
            statusCont.className = "offline";
            netText.innerText = "○ SIN CONEXIÓN (Modo Local)";
            // Intentar cargar ubicaciones desde caché en modo offline si no hay red
            if(ubicacionesData.length === 0) {
                const cache = localStorage.getItem('cache_ubicaciones');
                if(cache) {
                    ubicacionesData = JSON.parse(cache);
                    inicializarSelectores();
                }
            }
        }
        actualizarContador();
    }

    // 3. Sincronización Maestra
    async function sincronizar() {
        if (!navigator.onLine) return;
        const pendientes = await db.registros.where('estado').equals('P').toArray();
        if (pendientes.length === 0) return;

        const syncText = document.getElementById('sync-status');
        syncText.classList.add('syncing');

        for (let r of pendientes) {
            try {
                await fetch(URL_GOOGLE, {
                    method: 'POST',
                    mode: 'no-cors',
                    cache: 'no-cache',
                    body: JSON.stringify(r)
                });

                await db.registros.update(r.id, { estado: 'E' });
                console.log("Enviado: " + r.dni);
            } catch (error) {
                console.error("Fallo de envío:", error);
            }
        }
        syncText.classList.remove('syncing');
        actualizarContador();
    }

    // 4. Utilidades
    function calcularEdad(fecha) {
        if(!fecha) return;
        const hoy = new Date();
        const cumple = new Date(fecha);
        let edad = hoy.getFullYear() - cumple.getFullYear();
        if (hoy.getMonth() < cumple.getMonth() || (hoy.getMonth() === cumple.getMonth() && hoy.getDate() < cumple.getDate())) edad--;
        document.getElementById('edad').value = edad + " años";
    }

    function toggleFechaIngreso(val) {
        const div = document.getElementById('divFechaIngreso');
        document.getElementById('fechaIngreso').required = (val === "Ingresaré en otra fecha");
        div.className = (val === "Ingresaré en otra fecha") ? "" : "hidden";
    }

    // 5. Envío del Formulario
    document.getElementById('formEmpadronamiento').onsubmit = async (e) => {
        e.preventDefault();

        const vDni = document.getElementById('dni').value;
        const vCelular = document.getElementById('celular').value;
        const vWhatsapp = document.getElementById('whatsapp').value;

        if (vDni.length !== 8) {
            alert("⚠️ El DNI debe tener exactamente 8 dígitos.");
            return;
        }

        if (vCelular.length !== 9) {
            alert("⚠️ El número de Celular debe tener exactamente 9 dígitos.");
            return;
        }

        if (vWhatsapp.length !== 9) {
            alert("⚠️ El número de WhatsApp debe tener exactamente 9 dígitos.");
            return;
        }
        
        const registro = {
            fecha: new Date().toLocaleString('es-PE'),
            tipoReg: document.getElementById('tipoReg').value,
            dni: vDni,
            apellidos: document.getElementById('apellidos').value,
            nacimiento: document.getElementById('nacimiento').value,
            edad: document.getElementById('edad').value,
            genero: document.getElementById('genero').value,
            hijos: document.getElementById('hijos').value,
            celular: vCelular,
            whatsapp: vWhatsapp,
            conoce: document.getElementById('conoce').value,
            referencias: document.getElementById('referencias').value,
            tipoTrabajo: document.getElementById('tipoTrabajo').value,
            estado_movil: document.getElementById('estado_movil').value,
            experiencia: document.getElementById('experiencia').value,
            dep: document.getElementById('dep').value,
            prov: document.getElementById('prov').value,
            dist: document.getElementById('dist').value,
            zona: document.getElementById('zona').value,
            disponibilidad: document.getElementById('disponibilidad').value === "Inmediato" ? 
                            "Inmediato" : "Fecha: " + document.getElementById('fechaIngreso').value,
            estado: 'P'
        };
        
        await db.registros.add(registro);
        alert("✅ Registro guardado localmente.");
        alert("✅ GRACIAS POR REGISTRARTE, Agrícola Huarmen - fundo Frusan.");
        e.target.reset();
        document.getElementById('edad').value = "";
        
        // Resetear selectores de cascada a su estado base
        document.getElementById('prov').innerHTML = '<option value="">Provincia</option>';
        document.getElementById('dist').innerHTML = '<option value="">Distrito</option>';
        document.getElementById('zona').innerHTML = '<option value="">Zona Ej. Alan Garcia</option>';
        inicializarSelectores();
        
        updateNetStatus();
    };

    window.addEventListener('online', updateNetStatus);
    window.addEventListener('offline', updateNetStatus);
    updateNetStatus();

    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('service-worker.js');
    }

    function descargarHTML() {
        const htmlContent = document.documentElement.outerHTML;
        const blob = new Blob([htmlContent], { type: 'text/html' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'Empadronamiento_Huarmey_2026.html';
        a.click();
    }

    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        console.log("App lista para ser instalada en el celular");
    });

    async function instalarApp() {
        if (deferredPrompt) {
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            if (outcome === 'accepted') console.log('Usuario instaló la App');
            deferredPrompt = null;
        }
    }
</script>

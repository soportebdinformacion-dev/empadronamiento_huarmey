<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Empadronamiento Huarmey 2026</title>
    <style>
        :root { --rojo: #C62828; --verde: #2E7D32; --gris: #f4f4f4; --blanco: #ffffff; }
        body { font-family: 'Segoe UI', Roboto, sans-serif; background: var(--gris); margin: 0; padding: 10px; }
        .card { background: var(--blanco); max-width: 550px; margin: auto; padding: 20px; border-radius: 15px; border-top: 8px solid var(--rojo); box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .logo { display: block; margin: 0 auto 15px; max-width: 160px; }
        h2 { text-align: center; color: var(--verde); font-size: 1.2rem; margin-bottom: 20px; }
        section { margin-bottom: 15px; padding: 15px; border: 1px solid #ddd; border-radius: 12px; }
        legend { font-weight: bold; color: var(--rojo); font-size: 0.9rem; text-transform: uppercase; }
        label { display: block; margin-top: 12px; font-size: 0.85rem; font-weight: 600; color: #444; }
        input, select { width: 100%; padding: 12px; margin-top: 5px; border: 1.5px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 1rem; }
        input:focus { border-color: var(--verde); outline: none; }
        .btn { background: var(--verde); color: white; border: none; width: 100%; padding: 16px; border-radius: 10px; font-size: 1.1rem; font-weight: bold; margin-top: 25px; cursor: pointer; transition: 0.3s; }
        
        /* Indicadores de Red y Sincronización */
        #status-container { margin-bottom: 20px; padding: 12px; border-radius: 10px; text-align: center; font-weight: bold; font-size: 0.9rem; transition: 0.3s; }
        .online { background-color: #C8E6C9; color: #2E7D32; border: 1px solid #2E7D32; }
        .offline { background-color: #FFCDD2; color: #C62828; border: 1px solid #C62828; }
        .syncing { animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        .hidden { display: none; }

        /* Estilos de la Lista de Pendientes */
        #lista-pendientes { margin-top: 10px; font-size: 0.75rem; text-align: left; background: rgba(255,255,255,0.6); border-radius: 8px; padding: 8px; max-height: 120px; overflow-y: auto; border: 1px dashed #999; }
    </style>
</head>
<body>

<div class="card">
    <img src="ICONO HUARMEY.png" class="logo" alt="Agrícola Huarmey">
    <h2>Campaña Agrícola 2026</h2>
    
    <div id="status-container" class="online">
        <div id="network-status">Verificando red...</div>
        <div id="sync-status" style="font-size: 0.8rem; margin-top: 5px; color: #555;">
            Registros pendientes: <span id="pending-count">0</span>
        </div>
        <div id="lista-pendientes" class="hidden">
            <strong style="color:#333; display:block; margin-bottom:5px;">Por enviar:</strong>
            <div id="items-pendientes"></div>
        </div>
    </div>

    <form id="formEmpadronamiento">
        <section>
            <legend>📝 Información Personal</legend>
            <label>Tipo de Registro:</label>
            <select id="tipoReg" required>
                <option value="Registro independiente">Registro independiente</option>
                <option value="JOSE CHAVEZ">JOSE CHAVEZ</option>
                <option value="RIVALDO VALLES">RIVALDO VALLES</option>
                <option value="ALEX RUFASTO">ALEX RUFASTO</option>
                <option value="OSCAR BARREDA">OSCAR BARREDA</option>
                <option value="PILAR MONJA">PILAR PARRA</option>
                <option value="Lider ELESTER GARCIA">Lider ELESTER GARCIA</option>
                <option value="Lider FELIPE CHINCHAY">Lider FELIPE CHINCHAY</option>
                <option value="Lider NOEMI CALVAY">Lider NOEMI CALVAY</option>
                <option value="Lider EDITH SERRATO">Lider EDITH SERRATO</option>
                <option value="Lider SABINO TANTARICO">Lider SABINO TANTARICO</option>
                <option value="Lider SEGUNDO MAXIMO">Lider SEGUNDO MAXIMO</option>
                <option value="Lider GUILLERMO PEREZ">Lider GUILLERMO PEREZ</option>
                <option value="Lider MIGUEL MARTINO">Lider MIGUEL MARTINO</option>
                <option value="Lider MEDALY MORALES">Lider MEDALY MORALES</option>
                <option value="Lider NICOOL GARCIA">Lider NICOOL GARCIA</option>
                <option value="Lider CINDY ROJAS">Lider CINDY ROJAS</option>
                <option value="Proveedor JORGE ALAMO">Proveedor JORGE ALAMO</option>
                <option value="Lider MARICARMEN CHERO">Lider MARICARMEN CHERO</option>
                <option value="Lider CESAR RUIZ">Lider CESAR RUIZ</option>
                <option value="Lider MARIO CUEVA">Lider MARIO CUEVA</option>
                <option value="Lider ROSA SOPLOPUCO">Lider ROSA SOPLOPUCO</option>
                <option value="Lider SECUNDINO VASQUEZ">Lider SECUNDINO VASQUEZ</option>
                <option value="Lider WILMER CHAVEZ">Lider WILMER CHAVEZ</option>
                <option value="Lider DIOGENES MEGO">Lider DIOGENES MEGO</option>
                <option value="Lider ELIX FERNANDEZ">Lider ELIX FERNANDEZ</option>
                <option value="Lider EDUARDO FERNANDEZ">Lider EDUARDO FERNANDEZ</option>
                <option value="Lider JHON GUEVARA">Lider JHON GUEVARA</option>
                <option value="Lider CARLOS CAJUSOL">Lider CARLOS CAJUSOL</option>
                <option value="Lider MARISOL GUEVARA">Lider MARISOL GUEVARA</option>
            </select>

            <label>DNI (8 dígitos):</label>
            <input type="number" id="dni" required oninput="if(this.value.length > 8) this.value = this.value.slice(0, 8);">

            <label>Apellidos y Nombres:</label>
            <input type="text" id="apellidos" required placeholder="Ej: Perez Garcia, Juan">

            <label>Fecha de Nacimiento:</label>
            <input type="date" id="nacimiento" required onchange="calcularEdad(this.value)">

            <label>Edad:</label>
            <input type="text" id="edad" readonly style="background:#f0f0f0" placeholder="Calculado automáticamente">

             <label>Sexo:</label>
            <select id="genero" required>
                <option value="MASCULINO">MASCULINO</option>
                <option value="FEMENINO">FEMENINO</option>
                </select>
            </section>

            <label>N° de Hijos:</label>
            <input type="number" id="hijos" required min="0" value="0">

            <label>Celular / WhatsApp:</label>
            <div style="display:flex; gap:10px">
                <input type="number" id="celular" placeholder="Celular" required oninput="if(this.value.length > 9) this.value = this.value.slice(0, 9);">
                <input type="number" id="whatsapp" placeholder="WhatsApp" required oninput="if(this.value.length > 9) this.value = this.value.slice(0, 9);">
            </div>

            <label>¿Cómo conociste la empresa?</label>
            <select id="conoce" required>
                <option value="Facebook">Facebook</option>
                <option value="Amigo">Amigo</option>
                <option value="WhatsApp">WhatsApp</option>
                <option value="Líder">Líder</option>
                <option value="Reclutador">Reclutador</option>
                <option value="Otros">Otros</option>
            </select>

            <label>Referencias de la empresa:</label>
            <select id="referencias" required>
                <option value="Buenos pagos">Buenos pagos</option>
                <option value="Buen trato al personal">Buen trato al personal</option>
                <option value="Buenos bonos">Buenos bonos</option>
                <option value="Buenos sorteos">Buenos sorteos</option>
                <option value="Sin opinar">Sin opinar</option>
            </select>
        </section>

        <section>
            <legend>🛠 Laboral y Residencia</legend>
            <label>Tipo de trabajo:</label>
            <select id="tipoTrabajo" required>
                <option value="Campo">Campo</option>
                <option value="Packing">Packing</option>
            </select>

            <label>Modalidad:</label>
            <select id="estado_movil" required>
                <option value="Ida y vuelta">Ida y vuelta</option>
                <option value="Campamento">Campamento</option>
            </select>

            <label>Experiencia:</label>
            <select id="experiencia" required>
                <option value="Ninguno">Ninguno</option>
                <option value="Líder de zona + cosechador">Líder de zona + cosechador</option>
                <option value="Líder de zona">Líder de zona</option>
                <option value="Cosecha arándanos rendimiento">Cosecha arándanos rendimiento</option>
                <option value="Cosecha arándanos jornal">Cosecha arándanos jornal</option>
                <option value="Supervisor de campo">Supervisor de campo</option>
                <option value="Labores de arándanos">Labores de arándano</option>
                <option value="Servicios generales">Servicios generales</option>
                <option value="Operario packing jornal">Operario packing jornal</option>
                <option value="Operario packing rendimiento">Operario packing rendimiento</option>
                <option value="Conductor AI-II-III">Conductor AI-II-III</option>
            </select>

            <label>Ubicación:</label>
            <input type="text" id="dep" placeholder="Departamento" required>
            <input type="text" id="prov" placeholder="Provincia" required>
            <input type="text" id="dist" placeholder="Distrito" required>
            <input type="text" id="zona" placeholder="Zona Ej. Alan Garcia" required>
        </section>

        <section>
            <legend>✔ Confirmación</legend>
            <label>Disponibilidad:</label>
            <select id="disponibilidad" required onchange="toggleFechaIngreso(this.value)">
                <option value="Inmediato">Inmediato</option>
                <option value="Ingresaré en otra fecha">Ingresaré en otra fecha</option>
            </select>
            <div id="divFechaIngreso" class="hidden">
                <label>Fecha de Ingreso:</label>
                <input type="date" id="fechaIngreso">
            </div>
        </section>

        <button type="submit" class="btn">REGISTRAR PERSONAL</button>
        <button type="button" onclick="descargarHTML()" style="background:#555; margin-top:10px;" class="btn">Downloap App (Solo administradores)</button>
    </form>
</div>

<script src="https://unpkg.com/dexie@3.2.0/dist/dexie.min.js"></script>
<script>
    // 1. Inicializar Base de Datos
    const db = new Dexie('BD_REGISTROS_HUARMEY');
    db.version(1).stores({ registros: '++id, estado' });

    // 2. Función de Red y Estados (ACTUALIZADA CON LISTA)
    async function actualizarContador() {
        const pends = await db.registros.where('estado').equals('P').toArray();
        const countSpan = document.getElementById('pending-count');
        const listaDiv = document.getElementById('lista-pendientes');
        const itemsDiv = document.getElementById('items-pendientes');
        
        countSpan.innerText = pends.length;

        if (pends.length > 0) {
            listaDiv.classList.remove('hidden');
            itemsDiv.innerHTML = pends.map(r => 
                `<div style="margin-bottom:4px; padding:2px; border-bottom:1px solid rgba(0,0,0,0.05);">
                    DNI: <strong>${r.dni}</strong> - ${r.apellidos.toUpperCase()}
                </div>`
            ).join('');
        } else {
            listaDiv.classList.add('hidden');
        }
    }

    function updateNetStatus() {
        const statusCont = document.getElementById('status-container');
        const netText = document.getElementById('network-status');
        if (navigator.onLine) {
            statusCont.className = "online";
            netText.innerText = "● CONECTADO";
            sincronizar();
        } else {
            statusCont.className = "offline";
            netText.innerText = "○ SIN CONEXIÓN (Modo Local)";
        }
        actualizarContador();
    }

    // 3. Sincronización Maestra
    async function sincronizar() {
        if (!navigator.onLine) return;
        const pendientes = await db.registros.where('estado').equals('P').toArray();
        if (pendientes.length === 0) return;

        const syncText = document.getElementById('sync-status');
        syncText.classList.add('syncing');

        for (let r of pendientes) {
            try {
                const URL_GOOGLE = 'https://script.google.com/macros/s/AKfycbzgETb4_54THBZgm7Ah-0VYRzpMLWyEX-BiGYUG-cFCrKrpLA6mAFvnz1pY-B29GQTxkQ/exec'; 

                await fetch(URL_GOOGLE, {
                    method: 'POST',
                    mode: 'no-cors',
                    cache: 'no-cache',
                    body: JSON.stringify(r)
                });

                await db.registros.update(r.id, { estado: 'E' });
                console.log("Enviado: " + r.dni);
            } catch (error) {
                console.error("Fallo de envío:", error);
            }
        }
        syncText.classList.remove('syncing');
        actualizarContador();
    }

    // 4. Utilidades
    function calcularEdad(fecha) {
        if(!fecha) return;
        const hoy = new Date();
        const cumple = new Date(fecha);
        let edad = hoy.getFullYear() - cumple.getFullYear();
        if (hoy.getMonth() < cumple.getMonth() || (hoy.getMonth() === cumple.getMonth() && hoy.getDate() < cumple.getDate())) edad--;
        document.getElementById('edad').value = edad + " años";
    }

    function toggleFechaIngreso(val) {
        const div = document.getElementById('divFechaIngreso');
        document.getElementById('fechaIngreso').required = (val === "Ingresaré en otra fecha");
        div.className = (val === "Ingresaré en otra fecha") ? "" : "hidden";
    }

    // 5. Envío del Formulario
    document.getElementById('formEmpadronamiento').onsubmit = async (e) => {
        e.preventDefault();
        
        const registro = {
            fecha: new Date().toLocaleString('es-PE'),
            tipoReg: document.getElementById('tipoReg').value,
            dni: document.getElementById('dni').value,
            apellidos: document.getElementById('apellidos').value,
            nacimiento: document.getElementById('nacimiento').value,
            edad: document.getElementById('edad').value,
            genero: document.getElementById('genero').value,
            hijos: document.getElementById('hijos').value,
            celular: document.getElementById('celular').value,
            whatsapp: document.getElementById('whatsapp').value,
            conoce: document.getElementById('conoce').value,
            referencias: document.getElementById('referencias').value,
            tipoTrabajo: document.getElementById('tipoTrabajo').value,
            estado_movil: document.getElementById('estado_movil').value,
            experiencia: document.getElementById('experiencia').value,
            dep: document.getElementById('dep').value,
            prov: document.getElementById('prov').value,
            dist: document.getElementById('dist').value,
            zona: document.getElementById('zona').value,
            disponibilidad: document.getElementById('disponibilidad').value === "Inmediato" ? 
                            "Inmediato" : "Fecha: " + document.getElementById('fechaIngreso').value,
            estado: 'P'
        };
        
        await db.registros.add(registro);
        alert("✅ Registro guardado localmente.");
        alert("✅ GRACIAS POR REGISTRARTE, Agrícola Huarmen - fundo Frusan.");
        e.target.reset();
        document.getElementById('edad').value = "";
        updateNetStatus();
    };

    window.addEventListener('online', updateNetStatus);
    window.addEventListener('offline', updateNetStatus);
    updateNetStatus();

    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('service-worker.js');
    }

    /* --- NUEVA LÓGICA DE INSTALACIÓN Y DESCARGA (si hay problema con el codigo solo tienes que borrarlo) --- */

// Botón para descargar el archivo HTML actual
function descargarHTML() {
    const htmlContent = document.documentElement.outerHTML;
    const blob = new Blob([htmlContent], { type: 'text/html' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'Empadronamiento_Huarmey_2026.html';
    a.click();
}

// Lógica para detectar si la App se puede instalar (PWA)
let deferredPrompt;
window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    console.log("App lista para ser instalada en el celular");
});

// Función para invocar la instalación (puedes llamarla desde un botón si gustas)
async function instalarApp() {
    if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') console.log('Usuario instaló la App');
        deferredPrompt = null;
    }
}

</script>
</body>
</html>

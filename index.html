<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Empadronamiento Agrícola Huarmey</title>
    <style>
        :root { --rojo: #C62828; --verde: #2E7D32; }
        body { font-family: sans-serif; background: #f4f4f4; padding: 10px; }
        .card { background: white; max-width: 500px; margin: auto; padding: 20px; border-radius: 15px; border-top: 8px solid var(--rojo); box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .logo { display: block; margin: 0 auto 15px; max-width: 150px; }
        label { display: block; margin-top: 12px; font-weight: bold; font-size: 13px; }
        input, select { width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        .btn { background: var(--verde); color: white; border: none; width: 100%; padding: 16px; border-radius: 10px; font-size: 18px; font-weight: bold; margin-top: 20px; cursor: pointer; }
    </style>
</head>
<body>

<div class="card">
    <img src="ICONO HUARMEY.png" class="logo">
    <h3 style="text-align:center; color:var(--verde);">Empadronamiento Personal 2026</h3>

    <form id="formEmpadronamiento">
        <label>Tipo de Registro:</label>
        <select id="tipoReg" required>
            <option value="Independiente">Registro Independiente</option>
            <option value="JOSE CHAVEZ">JOSE CHAVEZ</option>
            <option value="RIVALDO VALLES">RIVALDO VALLES</option>
            <option value="ALEX RUFASTO">ALEX RUFASTO</option>
        </select>

        <label>DNI (8 dígitos):</label>
        <input type="number" id="dni" required oninput="if(this.value.length > 8) this.value = this.value.slice(0, 8);">

        <label>Apellidos y Nombres:</label>
        <input type="text" id="apellidos" required>

        <label>WhatsApp (9 dígitos):</label>
        <input type="number" id="whatsapp" required oninput="if(this.value.length > 9) this.value = this.value.slice(0, 9);">

        <label>¿Cómo conociste la empresa?</label>
        <select id="conoce" required>
            <option value="">Seleccione...</option>
            <option value="Facebook">Facebook</option>
            <option value="Amigo">Amigo</option>
            <option value="WhatsApp">WhatsApp</option>
            <option value="Líder">Líder</option>
            <option value="Reclutador">Reclutador</option>
            <option value="Otros">Otros</option>
        </select>

        <label>Buenas referencias:</label>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 5px; padding: 10px; background: #f9f9f9; border-radius: 8px;">
            <label style="font-weight:normal;"><input type="checkbox" name="ref" value="Buenos pagos"> Buenos pagos</label>
            <label style="font-weight:normal;"><input type="checkbox" name="ref" value="Buen trato"> Buen trato</label>
            <label style="font-weight:normal;"><input type="checkbox" name="ref" value="Buenos bonos"> Buenos bonos</label>
            <label style="font-weight:normal;"><input type="checkbox" name="ref" value="Buenos frutos"> Buenos frutos</label>
            <label style="font-weight:normal;"><input type="checkbox" name="ref" value="Ninguno"> Ninguno</label>
        </div>

        <button type="submit" class="btn">GUARDAR REGISTRO</button>
    </form>
</div>

<script src="https://unpkg.com/dexie@3.2.0/dist/dexie.min.js"></script>
<script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbyXW-h9qFmP_dZ-Ze4QR6SXD9T0mMmhEaQtXDTVDsJAPamzMl-ixu-RRQni_riSykbdFg/exec';
    const db = new Dexie('HuarmeyDB_2026');
    db.version(1).stores({ registros: '++id, estado' });

    document.getElementById('formEmpadronamiento').onsubmit = async (e) => {
        e.preventDefault();
        
        const refs = Array.from(document.querySelectorAll('input[name="ref"]:checked'))
                          .map(cb => cb.value).join(", ");

        const registro = {
            tipoReg: document.getElementById('tipoReg').value,
            dni: document.getElementById('dni').value,
            apellidos: document.getElementById('apellidos').value,
            whatsapp: document.getElementById('whatsapp').value,
            conoce: document.getElementById('conoce').value,
            referencias: refs || "Ninguna",
            estado: 'P'
        };

        await db.registros.add(registro);
        alert("✅ Guardado localmente.");
        e.target.reset();
        if(navigator.onLine) sincronizar();
    };

    async function sincronizar() {
        if (!navigator.onLine) return;
        const pends = await db.registros.where('estado').equals('P').toArray();
        for (let r of pends) {
            try {
                const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(r) });
                if (res.ok) await db.registros.update(r.id, { estado: 'E' });
            } catch (e) { console.error(e); }
        }
    }
    window.addEventListener('online', sincronizar);
</script>
</body>
</html>
